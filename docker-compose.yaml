services:
  sort: 
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sort
    depends_on:
      - MySQL
    ports:
      - "3000:3000"

  MySQL:
    container_name: my-sql-db-container
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: gh2OJZIwyaM
      MYSQL_DATABASE: sort-db
      MYSQL_USER: array_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./db:/var/lib/mysql

volumes:
  db: